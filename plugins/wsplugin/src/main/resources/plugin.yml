name: wsplugin
version: '${version}'

main: com.lsc.corp.wsplugin.Main
api-version: '26.1.2'
load: POSTWORLD

commands:
  wildsurvival:
    description: WildSurvival prototype command
    usage: /<command> <menu|guide|prototype|content|equipment|skills|craft|codex|stats|settings|ledger|status|test>
    aliases: [ws]
    permission: wildsurvival.use

permissions:
  wildsurvival.use:
    description: Use the WildSurvival player interface
    default: true
  wildsurvival.prototype.admin:
    description: Create, control, and inspect prototype runs
    default: op
  wildsurvival.content.validate:
    description: Validate embedded content bundles
    default: op
  wildsurvival.test.use:
    description: Inspect and open the isolated WildSurvival Test Lab
    default: op
  wildsurvival.test.session:
    description: Enter and exit isolated Test Lab sessions
    default: op
  wildsurvival.test.mutate:
    description: Mutate Test Lab players, content, entities, and world controls
    default: op
  wildsurvival.test.inspect:
    description: Inspect and export Test Lab state
    default: op
